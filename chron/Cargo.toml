[package]
name = "chron"
version = "0.1.0"
edition = "2024"

[lib]
name = "chron"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
thiserror = "2.0.21"
miette = "7.6.0"
reqwest = { version = "0.13.5", features = ["query", "json", "gzip", "brotli", "zstd"] }
tokio = "1.53.2"
